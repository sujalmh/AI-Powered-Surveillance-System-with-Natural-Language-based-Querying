# Paper 850 — headline number -> evidence source map (plan E7, gate G1).
# Every headline number in the REVISED paper must map to one measured JSON path
# or to a deployment-table row. Deployment values (section `deployment`) are
# RECORDED single-run measurements: they may appear ONLY inside the deployment
# study table, never in the abstract / contributions / conclusion.
# Schema (minimal subset, parsed without PyYAML by check_paper_numbers.py):
#   claims: [{id, tex:[literals], kind, source:{file, path|num/den|lo/hi, round},
#             near:<id> (same-line requirement, for CI endpoints)}]
#   kinds: value | fraction | ci | sd (mean +/- SD rendered as "0.417 +/- < 0.001")
version: 1
tex: INDICON2026_submit/INDICON2026Conference.tex

claims:
  # ---- C1: deterministic alert compiler (released benchmark) ----
  - id: C1-clean-test
    tex: [30/30]
    kind: fraction
    source:
      file: results/alert_results.json
      num: splits.test.clean.rule_correct
      den: splits.test.clean.n
