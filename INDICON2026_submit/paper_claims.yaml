# Deployment study rows: RECORDED single-run measurements, not re-computable.
# Allowed ONLY inside the deployment study table (caption mentions "deployment").
# Banned from abstract, contributions, and conclusion (gate G0).
deployment:
  - id: DEP-routing
    tex: [0.828]
    note: 4-camera adaptive macro P@5 (recorded)
  - id: DEP-routing-base
    tex: [0.666]
    note: 4-camera best fixed-alpha macro P@5 (recorded)
  - id: DEP-fusion
    tex: [0.807]
    kind: value
    note: 4-camera concat F5,10 (recorded)
  - id: DEP-fusion-rrf
    tex: [0.785]
    kind: value
    note: 4-camera RRF F5,10 (recorded)
  - id: DEP-fusion-vis
    tex: ["0.700"]
    kind: value
    note: 4-camera visual F5,10 (recorded)
  - id: DEP-alert
    tex: [91%]
    kind: value
    note: 60-utterance deployment rule-correctness, LLM materializer (recorded)
  - id: DEP-gallery
    tex: ["312,544"]
    kind: value
    note: deployment person-descriptor count (recorded)
  - id: DEP-lat-person
    tex: ["109"]
    kind: value
    units: ms
    note: person-index median ms over N=312,544 (recorded)
  - id: DEP-lat-e2e
    tex: ["6.0"]
    kind: value
    units: s
    note: operator-in-the-loop mean latency (recorded)
  - id: DEP-lat-find
    tex: ["12.0"]
    kind: value
    units: s
    note: Find-category latency (recorded)

# Tokens the checker must never flag (section/equation numbers, years, hardware).
# Headline claims above are NOT whitelisted. Unit-bearing deployment numbers
# (91%, 109 ms, 6.0 s, 12.0 s) are intentionally NOT whitelisted: outside the
# deployment table they are failures, not background numbers.
whitelist:
  - \b(19|20)\d{2}\b
  - \b850\b
  - \b1080p\b
  - \\(sub)?section
  - Eq\.|Table|Fig\.|Lemma|Observation
